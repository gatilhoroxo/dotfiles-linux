tools-padrao:
  - name: obsidian
    dir: obsidian-dir
    cmd: 'obsidian-dir/obsidian-files/obsidian --no-sandbox --disable-gpu > /dev/null 2>&1 &'
    alias: obsidian
    type: AppImage
    link: https://github.com/obsidianmd/obsidian-releases/releases/download/v1.6.7/Obsidian-1.6.7.AppImage

tools-dev:
  - name: vscode
    dir: vscode-dir
    cmd: 'vscode-dir/code --no-sandbox --disable-gpu > /dev/null 2>&1 &'
    alias: vscode
    type: .zip
    link: https://update.code.visualstudio.com/latest/linux-x64-zip/stable
  - name:
    dir:
    cmd:
    alias:
    type:
    link:

tools-dev-hard:
  - name: arduino
    dir: arduino-dir
    cmd: 'arduino-dir/arduino-1.8.19/arduino --no-sandbox --disable-gpu > /dev/null 2>&1 &'
    alias: arduino
    type: tar.xz
    link: https://downloads.arduino.cc/arduino-1.8.19-linux64.tar.xz
  - name: logisim-evolution
    dir: logisim-dir
    cmd: 'java -jar ~/../logisim-dir/logisim.jar > /dev/null 2>&1 &'
    alias: logisim
    type: jar
    link: https://github.com/logisim-evolution/logisim-evolution/releases/download/v4.0.0/logisim-evolution-4.0.0-all.jar
  - name: simulide
    dir: simulide-dir
    cmd: 'simulide-dir/simulide-files/AppRun > /dev/null 2>&1 &'
    alias: simulide
    type: AppImage
    link: https://osdn.net/dl/simulide/SimulIDE_1.1.0-R1973_Linux64.AppImage
    link2: https://simulide.com/p/downloads/
  - name: kicad (instavel)
    dir: kicad-dir
    cmd: 'kicad-dir/kicad-7.0.6/bin/kicad --no-sandbox --disable-gpu > /dev/null 2>&1 &'
    alias: kicad
    type: tar.bz2
    link: https://kicad.org/download/linux/kicad-7.0.6-x86_64.tar.bz2


tools-dev-soft:
  - name: godot
    dir: godot-dir
    cmd: 'godot-dir/godot4_ --no-sandbox --disable-gpu > /dev/null 2>&1 &'
    alias: godot
    type: zip
    link: https://downloads.tuxfamily.org/godotengine/3.5.1/mono/Godot_v3.5.1-stable_mono_x11_64.zip

tools-utils:
  - name: bitwarden
    type: AppImage
    cmd: 'bitwarden-dir/bitwarden-files/Bitwarden --no-sandbox --disable-gpu > /dev/null 2>&1 &'
    alias: bitwarden
    link: https://github.com/bitwarden/desktop/releases/download/v1.29.1/Bitwarden-1.29.1.AppImage
    dir: bitwarden-dir
  - name: todoist
    dir: todoist-dir
    cmd: 'todoist-dir/todoist-files/todoist --no-sandbox --disable-gpu > /dev/null 2>&1 &'
    alias: todoist
    type: AppImage
    link: https://github.com/todoist/todoist-linux/releases/download/v2.6.3/Todoist-2.6.3.AppImage
  - name: vivaldi
    dir: vivaldi-dir
    cmd: 'vivaldi-dir/vivaldi/vivaldi --no-sandbox --user-data-dir=\$HOME/files/tools/vivaldi-dir/perfil --disable-gpu > /dev/null 2>&1 &'
    alias: vivaldi
    type: deb
    link: https://downloads.vivaldi.com/stable/vivaldi-stable_7.9.3970.45-1_amd64.deb

