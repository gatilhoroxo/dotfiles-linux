tools-utils:
  - name: bitwarden
    type: AppImage
    cmd: 'bitwarden-dir/bitwarden-files/Bitwarden --no-sandbox --disable-gpu > /dev/null 2>&1 &'
    alias: bitwarden
    link: https://github.com/bitwarden/desktop/releases/download/v1.29.1/Bitwarden-1.29.1.AppImage
